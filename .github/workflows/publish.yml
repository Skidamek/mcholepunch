name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (defaults to mod_version in gradle.properties)'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mcholepunch
        uses: actions/checkout@v4

      - name: Resolve publish version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            VALUE=$(grep '^mod_version=' gradle.properties | cut -d= -f2-)
            echo "value=$VALUE" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Maven repository
        uses: actions/checkout@v4
        with:
          repository: Skidamek/maven
          path: maven-repo
          token: ${{ secrets.MAVEN_REPO_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and publish to Maven repository
        run: ./gradlew build publishAllPublicationsToMavenRepoRepository -Pmod_version="${{ steps.version.outputs.value }}" -PmavenRepoDir="$GITHUB_WORKSPACE/maven-repo"

      - name: Commit and push Maven repository
        working-directory: maven-repo
        run: |
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "Publish mcholepunch ${{ steps.version.outputs.value }}"
          git push
